version: '3.8'

services:
  6vdown:
    image: ghcr.io/anddyshen/6vdown:latest
    pull_policy: always
    container_name: 6vdown
    restart: unless-stopped
    # 采用 Host 主机网络：与群晖/家庭局域网处于完全同一网段，出站源 IP 即为 NAS 本机真实 IP
    network_mode: host
    volumes:
      # 持久化数据目录：数据库与配置文件均存放在当前目录的 data/ 中
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - C2DOWN_DATA_DIR=/app/data
      # 监听端口（Host 模式直接绑定宿主机端口，默认 5080 避开常见 8080 冲突）
      - PORT=5080
      # 后台管理员登录账号与密码（外网暴露时建议设置；也可启动后在 Web 设置页中修改）
      - C2DOWN_WEB_USERNAME=admin
      - C2DOWN_WEB_PASSWORD=
      # 可选：安全访问令牌（供第三方脚本或移动端免密访问）
      - C2DOWN_API_TOKEN=

