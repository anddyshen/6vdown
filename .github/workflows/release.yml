name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Application Icon
        run: |
          python tools/generate_icon.py

      - name: Build Portable Executable
        run: |
          pyinstaller --noconfirm --clean 6vdown.spec

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'latest' }
          Copy-Item "dist\6vdown.exe" -Destination "dist\6vdown-${tag}-windows-x64.exe"
          Get-ChildItem dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/6vdown.exe
            dist/6vdown-*-windows-x64.exe
          name: 6vdown ${{ github.ref_name }}
          generate_release_notes: true
